name: Build iUnlocker GLTool

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Get zygisk.hpp
        run: curl -fsSL -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

      - name: Build arm64-v8a
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 -j$(nproc)

      - name: Build armeabi-v7a
        run: |
          cmake -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 -j$(nproc)

      - name: Package
        run: |
          mkdir -p out/zygisk
          cp module.prop customize.sh service.sh out/
          cp -r webroot biscuits out/ 2>/dev/null || true
          cp build-arm64/libiunlocker_hide.so out/zygisk/arm64-v8a.so
          cp build-arm32/libiunlocker_hide.so out/zygisk/armeabi-v7a.so
          cd out && zip -r ../iUnlocker-GLTool-zynn.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: iUnlocker-GLTool-zynn
          path: iUnlocker-GLTool-zynn.zip
